name: Refresh research data and publish

on:
  schedule:
    # 06:17 Beijing, once every day (22:17 UTC on the previous day).
    # Scheduled runs may be delayed; source observation dates stay unchanged.
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      cold_start:
        description: Ignore historical source caches for a clean-run check
        type: boolean
        default: false
      publish:
        description: Commit validated data and publish the site
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: research-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A normal refresh plus full validation takes about 48 minutes. Allow one
    # complete recomputation when main advances during the first pass.
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Restore optional source caches
        if: ${{ github.event_name == 'schedule' || !inputs.cold_start }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .tmp-hist
            .tmp-strategy
            .tmp-fhsp
            .tmp-managers
            .tmp-snap/stocks
            .tmp-snap/overseas-stocks
            .tmp-snap/market-history
            .tmp-buy-location
            .tmp-portfolio
          key: research-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            research-source-${{ runner.os }}-
      - name: Test calculations and source guards
        run: |
          python3 -m unittest discover -s tests -q
          node --test tests/*.test.cjs
      - name: Refresh all scheduled datasets
        id: refresh
        run: python3 refresh.py --timeout 420 --funds-timeout 900 --portfolio-timeout 1200
      - name: Archive newly observed fund actions
        run: python3 scripts/build_fund_actions.py --apply
      - name: Update cross-border fund return bases and distributions
        run: python3 scripts/build_crossborder_data.py
      - name: Publish observed US ETF cash distributions
        run: python3 scripts/build_etf_distributions.py
      - name: Publish genuine index histories for return comparison
        run: python3 scripts/build_return_indices.py
      - name: Publish observed histories for financial events
        run: python3 scripts/build_financial_events.py
      - name: Update bank reference FX quotes with original timestamps
        continue-on-error: true
        run: python3 scripts/refresh_money_flow_quotes.py
      - name: Update historical market observations with original dates
        continue-on-error: true
        run: python3 market_history.py
      - name: Reject incomplete or regressed results
        run: |
          python3 scripts/check_refresh.py
          python3 -m unittest discover -s tests -q
          node --test tests/*.test.cjs
      - name: Verify generated browser assets
        run: |
          npm run version-assets
          npm run check
      - name: Save source caches for later runs
        # Preserve successfully fetched raw sources even when a later stage
        # rejects publication, so the next run can complete incrementally.
        if: ${{ always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .tmp-hist
            .tmp-strategy
            .tmp-fhsp
            .tmp-managers
            .tmp-snap/stocks
            .tmp-snap/overseas-stocks
            .tmp-snap/market-history
            .tmp-buy-location
            .tmp-portfolio
          key: research-source-${{ runner.os }}-${{ github.run_id }}
      - name: Publish validated data against latest main
        id: commit
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) }}
        run: python3 scripts/publish_refresh.py
      - name: Stage the validated site
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data docs _site/
          touch _site/.nojekyll
      - name: Configure Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload site for Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Preserve diagnosis for a failed run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnosis-${{ github.run_id }}
          path: |
            data/refresh-report.json
            data/quality.json
            data/update-status.json
            data/fund-actions.json
            data/screening-validation.json
            data/etf-distributions.js
            data/portfolio/catalog.js
            data/snapshot.js
            .tmp-snap/refresh-*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4
