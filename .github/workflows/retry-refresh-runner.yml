name: Retry a disconnected data refresh runner

on:
  workflow_run:
    workflows: [Refresh research data and publish]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: refresh-runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const retry = require('./scripts/retry_refresh_runner.cjs');
            return await retry({ github, context, core });
